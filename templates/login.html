<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in / FORENSIX</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='auth.css') }}">
</head>
<body>
<div class="auth-wrap">
  <form class="auth-card" method="post" autocomplete="on">
    <div class="brand"><div class="sigil"><span>F</span></div><div>FORENSIX</div></div>
    <h1>Sign in</h1>
    <p class="sub">Authorized investigators only. Accounts are issued by an administrator.</p>
    {% if error %}<div class="msg error">{{ error }}</div>{% endif %}
    <input type="hidden" name="csrf" value="{{ csrf_token() }}">
    <label for="username">Username</label>
    <input id="username" name="username" autocomplete="username" required autofocus>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button class="btn primary" type="submit">SIGN IN</button>
    <div class="hint">Need access? Ask your FORENSIX administrator to create an account.</div>
  </form>
</div>
</body>
</html>
